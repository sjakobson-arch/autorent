version: "3.8"

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autorent_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: autorent_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: autorent
      MYSQL_USER: autorent
      MYSQL_PASSWORD: autorent123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
